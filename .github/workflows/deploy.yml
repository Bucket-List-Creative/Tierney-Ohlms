name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the GitHub Pages deploy action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; a newer push cancels an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Static export can't build server-only routes (API handlers, the embedded
      # Studio) or a dynamic CMS route with no pre-known paths. The full-featured
      # source stays in the repo (for a server host like Vercel); we just drop
      # these for the Pages build.
      - name: Remove server-only routes for static export
        run: rm -rf app/api app/studio "app/(site)/[slug]"

      - name: Build static site
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "true"
        run: npm run build

      # Stop GitHub Pages' Jekyll from hiding the _next/ asset folder.
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
